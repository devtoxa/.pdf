<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
    <style>
        :root {
            --bg-color: #121212;
            --toolbar-bg: #1e1e1e;
            --border-color: #333333;
            --text-color: #e0e0e0;
            --accent-color: #4dabf7;
            --btn-hover: #2c2c2c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 10;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #file-name {
            font-size: 0.9rem;
            font-weight: 600;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
            user-select: none;
        }

        button:hover:not(:disabled) {
            background-color: var(--btn-hover);
            border-color: #555;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        input[type="number"] {
            background-color: #121212;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 6px;
            width: 55px;
            text-align: center;
            font-size: 0.85rem;
        }

        .page-info,
        .zoom-info {
            font-size: 0.85rem;
            color: #aaa;
        }

        main {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            gap: 20px;
            position: relative;
        }

        .pdf-page-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            background-color: #ffffff;
        }

        .pdf-page-container canvas {
            display: block;
        }

        #status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
            line-height: 1.6;
        }

        #status-message code {
            background: #1e1e1e;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-color);
        }
    </style>
</head>

<body>

    <header>
        <div class="toolbar-group">
            <span id="file-name" title="파일명">path 미지정</span>
        </div>

        <div class="toolbar-group">
            <button id="prev-page" disabled>이전</button>
            <input type="number" id="page-num" value="1" min="1" disabled />
            <span class="page-info">/ <span id="page-count">0</span></span>
            <button id="next-page" disabled>다음</button>
        </div>

        <div class="toolbar-group">
            <button id="zoom-out" disabled>-</button>
            <span class="zoom-info" id="zoom-level">120%</span>
            <button id="zoom-in" disabled>+</button>
            <button id="fit-width" disabled>너비 맞춤</button>
        </div>
    </header>

    <main id="viewer-container">
        <div id="status-message">
            <p>URL에 <code>?path=...</code> 파라미터를 지정해주세요.</p>
            <p style="margin-top: 8px; font-size: 0.85rem;">
                예시: <code>?path=/.pdf/sample.pdf</code>
            </p>
        </div>
    </main>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentScale = 1.2;
        let isRendering = false;

        const viewerContainer = document.getElementById('viewer-container');
        const statusMessage = document.getElementById('status-message');
        const fileNameEl = document.getElementById('file-name');
        const pageNumInput = document.getElementById('page-num');
        const pageCountEl = document.getElementById('page-count');
        const zoomLevelEl = document.getElementById('zoom-level');

        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const fitWidthBtn = document.getElementById('fit-width');

        function getPathParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('path');
        }

        function enableControls(totalPages) {
            pageCountEl.textContent = totalPages;
            pageNumInput.max = totalPages;
            pageNumInput.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            zoomInBtn.disabled = false;
            zoomOutBtn.disabled = false;
            fitWidthBtn.disabled = false;
        }

        async function renderAllPages() {
            if (!pdfDoc || isRendering) return;
            isRendering = true;

            viewerContainer.innerHTML = '';
            zoomLevelEl.textContent = `${Math.round(currentScale * 100)}%`;

            const outputScale = window.devicePixelRatio || 1;

            for (let num = 1; num <= pdfDoc.numPages; num++) {
                const page = await pdfDoc.getPage(num);
                const viewport = page.getViewport({ scale: currentScale });

                const pageContainer = document.createElement('div');
                pageContainer.className = 'pdf-page-container';
                pageContainer.dataset.pageNumber = num;
                pageContainer.style.width = `${viewport.width}px`;
                pageContainer.style.height = `${viewport.height}px`;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                const textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                textLayerDiv.style.width = `${viewport.width}px`;
                textLayerDiv.style.height = `${viewport.height}px`;
                textLayerDiv.style.setProperty('--scale-factor', currentScale);

                pageContainer.appendChild(canvas);
                pageContainer.appendChild(textLayerDiv);
                viewerContainer.appendChild(pageContainer);

                await page.render({
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                }).promise;

                const textContent = await page.getTextContent();
                pdfjsLib.renderTextLayer({
                    textContentSource: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });
            }

            isRendering = false;
        }

        async function loadPdfFromPath(pdfPath) {
            const displayName = decodeURIComponent(pdfPath.split('/').pop().split('?')[0] || 'document.pdf');
            try {
                statusMessage.style.display = 'block';
                statusMessage.innerHTML = '<p>PDF 문서를 불러오는 중입니다...</p>';
                fileNameEl.textContent = displayName;
                fileNameEl.title = pdfPath;
                document.title = `${displayName} - PDF Viewer`;

                const loadingTask = pdfjsLib.getDocument(pdfPath);
                pdfDoc = await loadingTask.promise;

                statusMessage.style.display = 'none';
                enableControls(pdfDoc.numPages);
                await renderAllPages();
            } catch (err) {
                console.error(err);
                statusMessage.style.display = 'block';
                statusMessage.innerHTML = `
          <p style="color: #ff6b6b;">PDF를 불러오는 데 실패했습니다.</p>
          <p style="font-size: 0.85rem; margin-top: 6px;"><code>${pdfPath}</code> 경로를 확인해주세요.<br>(${err.message})</p>
        `;
            }
        }

        function scrollToPage(num) {
            const target = viewerContainer.querySelector(`.pdf-page-container[data-page-number="${num}"]`);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                pageNumInput.value = num;
            }
        }

        viewerContainer.addEventListener('scroll', () => {
            const pages = document.querySelectorAll('.pdf-page-container');
            const containerTop = viewerContainer.getBoundingClientRect().top;

            for (const page of pages) {
                const rect = page.getBoundingClientRect();
                if (rect.top <= containerTop + 150 && rect.bottom >= containerTop + 150) {
                    pageNumInput.value = page.dataset.pageNumber;
                    break;
                }
            }
        });

        prevBtn.addEventListener('click', () => {
            const current = parseInt(pageNumInput.value, 10);
            if (current > 1) scrollToPage(current - 1);
        });

        nextBtn.addEventListener('click', () => {
            const current = parseInt(pageNumInput.value, 10);
            if (pdfDoc && current < pdfDoc.numPages) scrollToPage(current + 1);
        });

        pageNumInput.addEventListener('change', () => {
            if (!pdfDoc) return;
            let val = parseInt(pageNumInput.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            if (val > pdfDoc.numPages) val = pdfDoc.numPages;
            scrollToPage(val);
        });

        zoomInBtn.addEventListener('click', () => {
            if (currentScale >= 3.0) return;
            currentScale = +(currentScale + 0.2).toFixed(2);
            renderAllPages();
        });

        zoomOutBtn.addEventListener('click', () => {
            if (currentScale <= 0.4) return;
            currentScale = +(currentScale - 0.2).toFixed(2);
            renderAllPages();
        });

        fitWidthBtn.addEventListener('click', async () => {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(1);
            const unscaledViewport = page.getViewport({ scale: 1 });
            const availableWidth = viewerContainer.clientWidth - 48;
            currentScale = +(availableWidth / unscaledViewport.width).toFixed(2);
            renderAllPages();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const pdfPath = getPathParam();
            if (pdfPath) {
                loadPdfFromPath(pdfPath);
            }
        });
    </script>
</body>

</html>
